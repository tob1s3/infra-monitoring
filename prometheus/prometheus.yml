global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: demo

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Метрики сервера: CPU, память, диск, сеть
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Доступность сайтов и сроки сертификатов (свой экспортер на Python)
  - job_name: site-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["site-exporter:9877"]

  # Метрики приложения booking-api: запросы, задержки, бизнес-метрики
  - job_name: booking-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
