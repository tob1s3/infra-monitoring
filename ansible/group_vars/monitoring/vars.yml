monitoring_dir: /opt/monitoring
monitoring_bind_address: 127.0.0.1

# Секреты лежат в vault.yml, зашифрованном ansible-vault (см. vault.example.yml)
grafana_admin_password: "{{ vault_grafana_admin_password }}"
telegram_bot_token: "{{ vault_telegram_bot_token }}"
telegram_chat_id: "{{ vault_telegram_chat_id }}"

monitoring_interval_seconds: 30
monitoring_targets:
  - name: github
    url: https://github.com
  - name: spbstu
    url: https://www.spbstu.ru
    timeout_seconds: 10
