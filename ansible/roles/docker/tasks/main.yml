# Установка Docker Engine и плагина compose из официального репозитория Docker
- name: Проверить, что система поддерживается
  ansible.builtin.assert:
    that: ansible_facts['distribution'] in ['Ubuntu', 'Debian']
    fail_msg: "Роль рассчитана на Ubuntu или Debian, а не {{ ansible_facts['distribution'] }}"

- name: Установить зависимости для репозитория
  ansible.builtin.apt:
    name: [ca-certificates, curl]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Создать каталог для ключей apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Скачать GPG-ключ Docker
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Подключить репозиторий Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch[ansible_facts['architecture']] | default('amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
  vars:
    docker_arch:
      x86_64: amd64
      aarch64: arm64

- name: Установить Docker Engine и compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Запустить Docker и включить автозапуск
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
