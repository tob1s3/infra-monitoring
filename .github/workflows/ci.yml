name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PROMETHEUS_IMAGE: prom/prometheus:v3.5.0
  ALERTMANAGER_IMAGE: prom/alertmanager:v0.28.1

jobs:
  exporter:
    name: Экспортер — линтер, SAST, тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../scripts && ruff format --check . ../scripts
      - run: bandit -c pyproject.toml -r site_exporter
      - run: pytest -v

  prometheus:
    name: Конфиг и алерты Prometheus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config
        run: >
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool
          "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
      - name: promtool test rules (юнит-тесты алертов)
        run: >
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool
          "$PROMETHEUS_IMAGE" test rules /etc/prometheus/tests/alerts_test.yml

  alertmanager:
    name: Конфиг Alertmanager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2
      - name: Отрендерить шаблон с тестовыми значениями
        env:
          TELEGRAM_BOT_TOKEN: "000000:ci-dummy-token"
          TELEGRAM_CHAT_ID: "-100123"
        run: python scripts/render_config.py
      - name: amtool check-config
        run: >
          docker run --rm -v "$PWD/alertmanager:/cfg:ro" --entrypoint amtool
          "$ALERTMANAGER_IMAGE" check-config /cfg/alertmanager.yml

  grafana:
    name: Дашборд Grafana актуален
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_dashboard.py
      - name: JSON в репозитории совпадает со сгенерированным
        run: git diff --exit-code grafana/dashboards/

  ansible:
    name: Ansible — синтаксис и ansible-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint
      - run: cp group_vars/monitoring/vault.example.yml group_vars/monitoring/vault.yml
      - run: ansible-playbook -i inventory.example.ini playbook.yml --syntax-check
      - run: ansible-lint playbook.yml

  compose:
    name: Сборка и сканирование образа экспортера
    runs-on: ubuntu-latest
    needs: [exporter, prometheus, alertmanager]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        env:
          GRAFANA_ADMIN_PASSWORD: ci-dummy-password
        run: docker compose config --quiet
      - name: Сборка образа site-exporter
        run: docker build -t site-exporter:${{ github.sha }} exporter
      - name: Trivy (уязвимости в образе)
        # Для боевых проектов action лучше закреплять по SHA коммита, а не по тегу
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: site-exporter:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
